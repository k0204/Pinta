  <rect width="2048" height="2048" fill="#ffffff"/>

  <!-- Canonical order: down, down-right, right, up-right / up, up-left, left, down-left. -->
  <g transform="translate(256 512)"><use xlink:href="#front"/></g>
  <g transform="translate(768 512)"><use xlink:href="#front-right"/></g>
  <g transform="translate(1280 512)"><use xlink:href="#side-right"/></g>
  <g transform="translate(1792 512)"><use xlink:href="#back-right"/></g>

  <g transform="translate(256 1536)"><use xlink:href="#back"/></g>
